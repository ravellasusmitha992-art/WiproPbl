<!DOCTYPE html>
<html>
<head>
<title>Background Color Change</title>

<script>

function changeColor(color)
{
    document.body.style.backgroundColor = color;
}

</script>

</head>

<body>

<h2>Click Any Link</h2>

<a href="#" onclick="changeColor('white')">White</a><br><br>

<a href="#" onclick="changeColor('red')">Red</a><br><br>

<a href="#" onclick="changeColor('blue')">Blue</a><br><br>

<a href="#" onclick="changeColor('pink')">Pink</a>

</body>
</html>
