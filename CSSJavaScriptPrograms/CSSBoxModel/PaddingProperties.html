<!DOCTYPE html>
<html>
<head>
    <title>Padding Properties</title>

    <style>

        .p1{
            border:2px solid black;
            padding-left:3cm;
            margin:20px;
        }

        .p2{
            border:2px solid blue;
            padding-right:50%;
            margin:20px;
        }

        .p3{
            border:2px solid red;
            padding-bottom:25%;
            margin:20px;
        }

        .p4{
            border:2px solid green;
            padding-top:25%;
            margin:20px;
        }

    </style>

</head>

<body>

<h2>Padding Properties</h2>

<p class="p1">
This is the first paragraph. Left padding is 3 cm.
</p>

<p class="p2">
This is the second paragraph. Right padding is 50%.
</p>

<p class="p3">
This is the third paragraph. Bottom padding is 25%.
</p>

<p class="p4">
This is the fourth paragraph. Top padding is 25%.
</p>

</body>
</html>
