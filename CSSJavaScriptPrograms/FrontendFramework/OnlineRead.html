<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OnlineRead</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">OnlineRead</h2>

    <h4>Book Types</h4>

    <button class="btn btn-light">All</button>

    <button class="btn btn-primary">Kids</button>

    <button class="btn btn-success">Teens</button>

    <button class="btn btn-info text-dark">Scientific</button>

    <button class="btn btn-warning">Crime</button>

    <button class="btn btn-danger">Horror</button>

    <button class="btn btn-secondary">Feedback</button>

    <hr>

    <h4>Comfort Font Size</h4>

    <button class="btn btn-primary btn-lg">Large</button>

    <button class="btn btn-primary">Medium</button>

    <button class="btn btn-primary btn-sm">Small</button>

    <button class="btn btn-outline-primary btn-sm">Extra Small</button>

</div>

</body>
</html>
