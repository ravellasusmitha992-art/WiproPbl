<!DOCTYPE html>
<html>
<head>
    <title>AJAX City List</title>
    <script>
        function getCities() {
            var state = document.getElementById("stateSelect").value;
            if (state == "") {
                document.getElementById("cityResult").innerHTML = "";
                return;
            }

            // AJAX Request క్రియేట్ చేయడం
            var xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    // సర్వర్ నుండి వచ్చిన డేటాను div లో పెట్టడం
                    document.getElementById("cityResult").innerHTML = this.responseText;
                }
            };
            // Servlet కి రిక్వెస్ట్ పంపడం
            xhttp.open("GET", "CityServlet?state=" + state, true);
            xhttp.send();
        }
    </script>
</head>
<body>
    <h2>Select a State to see Cities</h2>
    <select id="stateSelect" onchange="getCities()">
        <option value="">--Select State--</option>
        <option value="AndhraPradesh">Andhra Pradesh</option>
        <option value="Telangana">Telangana</option>
        <option value="Karnataka">Karnataka</option>
    </select>

    <br><br>
    <div id="cityResult">
        <!-- ఇక్కడ టేబుల్ డిస్ప్లే అవుతుంది -->
    </div>
</body>
</html>
