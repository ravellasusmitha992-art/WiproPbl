<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>

    <style>
        table{
            border-collapse: collapse;
            width: 50%;
            font-family: "Times New Roman", serif;
        }

        table, th, td{
            border: 1px solid black;
        }

        th, td{
            padding: 10px;
            text-align: center;
        }

        th{
            background-color: lightgray;
        }
    </style>
</head>

<body>

<h2>Student Details</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Marks</th>
    </tr>

    <tr>
        <td>101</td>
        <td>Susmitha</td>
        <td>90</td>
    </tr>

    <tr>
        <td>102</td>
        <td>Rahul</td>
        <td>85</td>
    </tr>

</table>

</body>
</html>
