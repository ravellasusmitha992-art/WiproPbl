<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Login Module</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 70px auto;
            padding: 30px;
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px #aaa;
        }

        h1 {
            text-align: center;
        }

        table {
            margin: auto;
        }

        td {
            padding: 8px;
        }

        input[type="text"],
        input[type="password"] {
            width: 200px;
            padding: 7px;
        }

        input[type="submit"] {
            padding: 8px 20px;
        }

        .center {
            text-align: center;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Login</h1>

    <form action="login" method="post">

        <table>

            <tr>
                <td>User Name:</td>
                <td>
                    <input type="text"
                           name="username"
                           required>
                </td>
            </tr>

            <tr>
                <td>Password:</td>
                <td>
                    <input type="password"
                           name="password"
                           required>
                </td>
            </tr>

            <tr>
                <td colspan="2" class="center">
                    <input type="submit"
                           value="Login">
                </td>
            </tr>

        </table>

    </form>

    <br>

    <div class="center">
        <a href="register.jsp">New User</a>
        |
        <a href="changePassword.jsp">Change Password</a>
    </div>

</div>

</body>
</html>
